name: Vane extension

on:
  pull_request:
  push:
    branches: [v0.1.1_vane]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Preserve native DuckDB and check Vane sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an additions-only change against Ossie v0.1.1
        run: git diff --no-renames --exit-code --diff-filter=CDMRTUXB 5180c67299ca14fde9d46806c7d35f9f53c2f1a9 HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check Vane formatting and Python syntax
        run: |
          python -m pip install black==24.10.0 clang_format==11.0.1 cmake-format==0.6.13
          python -m black --check scripts/build_vane_wheels.py test/vane
          clang-format --dry-run --Werror vane/ossie_vane_extension.cpp
          cmake-format --check vane/CMakeLists.txt extension_config_vane.cmake extension_config_vane_loadable.cmake
          python -m compileall -q scripts/build_vane_wheels.py test/vane

  build:
    name: Build Vane DuckDB and signed Ossie provider
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VANE_CI_TOOLS_DIR: ${{ github.workspace }}/ci-tools
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_NATIVE_BUILD_DIR: ${{ github.workspace }}/build/native
      VANE_WHEEL_BUILD_DIR: ${{ github.workspace }}/build/wheel
      VANE_WHEEL_DIST_DIR: ${{ github.workspace }}/dist
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_BUILD_JOBS: "4"
      VCPKG_TARGET_TRIPLET: x64-linux-release
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
      VANE_CMAKE_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AstroVela/vane-extension-ci-tools
          ref: 9de078021e3cb0ee09d50568aca114e58f2c2014
          path: ci-tools
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify CI tools and read exact source pins
        id: manifest
        working-directory: extension
        run: |
          make -f Makefile.vane vane_validate
          python ../ci-tools/scripts/vane_extension.py \
            --manifest vane-extension.toml --extension-root . \
            manifest --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false
      - name: Install native and wheel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison build-essential ccache curl flex libtool nasm ninja-build pkg-config unzip zip
          python -m pip install build cmake==3.31.6 ninja 'pybind11[global]>=3.0' 'scikit-build-core>=0.11.4' 'setuptools-scm>=9.2' 'packaging>=24.2' 'pyelftools>=0.33' 'auditwheel>=6.4' patchelf
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
      - name: Remove the verified run-vcpkg state marker
        env:
          EXPECTED_VCPKG_REVISION: ${{ steps.manifest.outputs.vcpkg_revision }}
        run: |
          set -euo pipefail
          marker="$GITHUB_WORKSPACE/vcpkg/vcpkgLastBuiltCommitId"
          test -f "$marker" && test ! -L "$marker"
          test "$(wc -c < "$marker")" -eq 40
          test "$(cat "$marker")" = "$EXPECTED_VCPKG_REVISION"
          rm -- "$marker"
          test -z "$(git -C "$GITHUB_WORKSPACE/vcpkg" status --porcelain --untracked-files=all)"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-ossie-${{ runner.os }}-${{ runner.arch }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}
      - name: Build and test Ossie against Vane DuckDB
        working-directory: extension
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: make -f Makefile.vane vane_native
      - name: Build and verify Vane and Ossie provider wheels
        working-directory: extension
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: make -f Makefile.vane vane_wheel
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-ossie-wheels
          path: dist/*.whl
          if-no-files-found: error

  integration:
    name: Installed Ossie provider (${{ matrix.runner }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [local, ray]
    env:
      VANE_RUNNER: ${{ matrix.runner }}
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vane-ossie-wheels
          path: wheels
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the exact wheel pair
        run: |
          python -m pip install wheels/*.whl pytest pytest-timeout
          python -m pip check
      - name: Test installed provider and runner
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest -c "$GITHUB_WORKSPACE/test/vane/pytest.ini" \
            "$GITHUB_WORKSPACE/test/vane/test_${VANE_RUNNER}_ossie.py" \
            --timeout=180 -v
